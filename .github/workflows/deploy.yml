name: Test Demo
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up nodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
  Deploy:
    runs-on: uduntu-latest
    steps:
      - name: Build Project
        run: npm run build
      - name: Deploy to Server
        run: echo "Deploying to server....."